name: Dependency Guard

on:
  pull_request:
    paths:
      - 'backend/package.json'
      - 'frontend/package.json'
      - 'backend/package-lock.json'
      - 'frontend/package-lock.json'
      - '.github/security/blocked-packages.json'
      - '.github/security/dependency-age-policy.json'
      - 'scripts/verify-dependencies.js'
      - 'scripts/verify-fresh-allowlist-security.js'
  push:
    branches:
      - integration
      - release
    paths:
      - 'backend/package.json'
      - 'frontend/package.json'
      - 'backend/package-lock.json'
      - 'frontend/package-lock.json'
      - '.github/security/blocked-packages.json'
      - '.github/security/dependency-age-policy.json'
      - 'scripts/verify-dependencies.js'
      - 'scripts/verify-fresh-allowlist-security.js'

jobs:
  dependency-policy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci --ignore-scripts

      - name: Install frontend dependencies
        run: cd frontend && npm ci --ignore-scripts

      - name: Enforce dependency policy
        run: node scripts/verify-dependencies.js

      - name: Run fresh-allowlist security checks
        run: node scripts/verify-fresh-allowlist-security.js
