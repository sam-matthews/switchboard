name: Image Age Policy

on:
  pull_request:
    paths:
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - '.github/security/image-policy.json'
      - 'scripts/verify-images.js'
      - '.github/workflows/security-scan.yml'
  push:
    branches:
      - integration
      - release
    paths:
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - '.github/security/image-policy.json'
      - 'scripts/verify-images.js'
      - '.github/workflows/security-scan.yml'
  schedule:
    - cron: '0 2 * * 1'

jobs:
  image-age-policy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Enforce image minimum-age policy
        run: node scripts/verify-images.js
